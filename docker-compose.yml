version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: neworbis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neworbis
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neworbis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: